name: Validar flujo de ramas

# Flujo: feature/<integrante> -> develop -> staging -> main
#        hotfix/*             -> main / staging / develop

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validar:
    name: Validar flujo de ramas
    runs-on: ubuntu-latest
    steps:
      - name: Revisar nombre de rama y destino
        env:
          ORIGEN: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          echo "PR: $ORIGEN -> $DESTINO"
          case "$DESTINO" in
            main)    PERMITIDO='^(staging|hotfix/.+)$' ;;
            staging) PERMITIDO='^(develop|hotfix/.+)$' ;;
            develop) PERMITIDO='^(feature/[a-z0-9._-]+|fix/.+|chore/.+|docs/.+|hotfix/.+|staging|main)$' ;;
            *)       echo "Destino '$DESTINO' sin reglas; se permite."; exit 0 ;;
          esac

          if ! printf '%s' "$ORIGEN" | grep -Eq "$PERMITIDO"; then
            echo "::error::No se permite PR de '$ORIGEN' hacia '$DESTINO'. Flujo esperado: feature/<integrante> -> develop -> staging -> main (hotfix/* puede ir a main)."
            exit 1
          fi

          # Un PR desde una rama de integrante debe decir qué CDU entrega
          case "$ORIGEN" in
            feature/*)
              if ! printf '%s' "$TITULO" | grep -Eq 'CDU-[0-9]{2}'; then
                echo "::error::El título del PR debe incluir el o los CDU que entrega (ejemplo: 'CDU-04, CDU-05: asignación PEPS')."
                exit 1
              fi ;;
          esac
          echo "Flujo válido."
